name: NEXUS Video - Manual Cinematic Horror Test
on:
  workflow_dispatch:
    inputs:
      category:
        description: Tipo de historia para esta prueba
        type: choice
        required: true
        default: terror psicológico
        options:
          - terror psicológico
          - paranormal
          - leyenda urbana
          - casa embrujada
          - criaturas
permissions:
  contents: read
concurrency:
  group: nexus-video-manual-test
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile nexus_video/engine.py
      - name: Generate one cinematic horror story
        env:
          HORROR_CATEGORY: \${{ inputs.category }}
          PIPER_VOICE: es_MX-claude-high
        run: python -m nexus_video.engine
      - name: Upload cinematic MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cinematic-horror-test
          path: |
            output/*.mp4
            output/metadata.json
            output/script.txt
          if-no-files-found: error
          retention-days: 14
