name: NEXUS Video - Manual Test
on:
  workflow_dispatch:
    inputs:
      title:
        description: Título de la historia (opcional)
        required: true
        default: La llamada del sótano
      script:\n        description: Guion opcional; vacío para generar una historia de terror original\n        required: false\n        default: ''\npermissions:
  contents: read
concurrency:
  group: nexus-video-manual-test
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Render narrated MP4
        env:
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_SCRIPT: ${{ inputs.script }}
          PIPER_VOICE: es_MX-ald-medium
        run: python -m nexus_video.engine
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-video-manual-test
          path: |
            output/*.mp4
            output/metadata.json
            output/script.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload and verify Google Drive
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python -m nexus_video.drive_upload
      - name: Notify Make with metadata only
        if: always()
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: python -m nexus_video.notify_make
