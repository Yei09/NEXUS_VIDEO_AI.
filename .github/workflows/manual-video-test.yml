name: NEXUS Video - Manual Horror Test
on:
  workflow_dispatch:
    inputs:
      category:
        description: Tipo de historia para esta prueba
        type: choice
        required: true
        default: terror psicológico
        options:
          - terror psicológico
          - paranormal
          - leyenda urbana
          - casa embrujada
          - criaturas
permissions:
  contents: read
concurrency:
  group: nexus-video-manual-test
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate one original horror story
        env:
          HORROR_CATEGORY: ${{ inputs.category }}
          PIPER_VOICE: es_MX-ald-medium
        run: python -m nexus_video.engine
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-horror-story-test
          path: |
            output/*.mp4
            output/metadata.json
            output/script.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload and verify Google Drive (optional)
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python -m nexus_video.drive_upload
      - name: Notify Make with metadata only (optional)
        if: always()
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: python -m nexus_video.notify_make
