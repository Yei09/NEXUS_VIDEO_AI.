name: NEXUS Blender 3D prototype (manual and PR sync)
on:
  pull_request:
    branches: [cinematic-v3]
    types: [synchronize]
  workflow_dispatch:
    inputs:
      samples:
        description: Cycles CPU samples (keep low on free runners)
        required: true
        default: "8"
jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 3 && github.event.pull_request.head.ref == 'cinematic-reconstruction' && github.event.pull_request.base.ref == 'cinematic-v3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Verify event and exact source commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$EVENT_ACTION" == "synchronize" ]]
            [[ "$PR_NUMBER" == "3" ]]
            [[ "$PR_HEAD_REF" == "cinematic-reconstruction" ]]
            [[ "$PR_BASE_REF" == "cinematic-v3" ]]
            [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]]
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "SOURCE_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
            echo "Validated PR #$PR_NUMBER head $PR_HEAD_SHA"
          else
            [[ "$DISPATCH_REF" == "refs/heads/cinematic-reconstruction" ]]
            echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "Validated manual branch $GITHUB_SHA"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]]
          echo "CHECKED_OUT_SHA=$actual"
          git status --short
      - name: Measure dependency installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender ffmpeg espeak-ng
          end=$(date +%s)
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Install Python validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install numpy opencv-python-headless
      - name: Apply runner-local Euler keyframe correction and preserve source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender3d
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          path = Path("nexus_video3d/scene_factory.py")
          source = path.read_text(encoding="utf-8")
          backup = Path("artifacts/blender3d/scene_factory_source.py")
          backup.write_text(source, encoding="utf-8")
          old = '''def key(obj,path,values,index=None):
           for f,v in values:
            if index is None: setattr(obj,path,v)
            else: getattr(obj,path)[index]=v
            obj.keyframe_insert(data_path=path,index=index,frame=f)
          '''
          new = '''def key(obj,path,values,index=None):
           for f,v in values:
            if index is None: setattr(obj,path,v)
            else:
             component = v[index] if isinstance(v,(tuple,list)) else v
             getattr(obj,path)[index]=component
            obj.keyframe_insert(data_path=path,index=index,frame=f)
          '''
          if old not in source:
              raise SystemExit("Expected Euler helper source not found; refusing an unverified patch")
          patched = source.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")
          report = {
              "patch": "runner_local_euler_component_assignment",
              "reason": "The door hinge keyframes pass a 3-component Euler tuple with array_index=2; select the Z component before key insertion.",
              "source_sha256": hashlib.sha256(source.encode()).hexdigest(),
              "runtime_sha256": hashlib.sha256(patched.encode()).hexdigest(),
              "repository_files_modified": False
          }
          Path("artifacts/blender3d/runtime_patch_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Render 10-second 3D scene on CPU
        env:
          NEXUS_INSTALL_SECONDS: ${{ steps.install.outputs.seconds }}
        run: |
          .venv/bin/python tools/render_3d_prototype.py --out artifacts/blender3d --samples "${{ inputs.samples || '8' }}"
      - name: Validate MP4 and visible motion
        run: |
          .venv/bin/python tools/validate_3d_prototype.py artifacts/blender3d
          ffprobe -v error -show_streams -show_format artifacts/blender3d/nexus_blender3d_10s.mp4 > artifacts/blender3d/ffprobe.json
          free -h > artifacts/blender3d/memory_snapshot.txt
          du -ah artifacts/blender3d | sort -h > artifacts/blender3d/file_sizes.txt
      - name: Upload authentic render and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-blender3d-prototype-${{ github.run_number }}
          path: artifacts/blender3d/
          if-no-files-found: warn
          retention-days: 14
